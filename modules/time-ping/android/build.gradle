// Gradle build for the local Expo module `time-ping` (Android-only).
//
// The heavy lifting (compileSdk, Kotlin toolchain, the expo-modules-core dependency,
// the JSI/autolinking glue) is supplied by `expo-module-gradle-plugin`, which ships
// inside expo-modules-core. Applying that plugin is what makes this a first-class Expo
// native module rather than a bare AAR — so this file only declares the bits unique to
// us: the namespace and the minimum SDK. Nothing here compiles locally; it is built in
// the cloud by EAS / GitHub Actions (see the repo eas.json + CI workflow).
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'expo-module-gradle-plugin'

group = 'agency.lumieremedia.timeaudit.timeping'
version = '0.1.0'

android {
  namespace 'agency.lumieremedia.timeaudit.timeping'

  defaultConfig {
    // AlarmManager.setExactAndAllowWhileIdle + setShowWhenLocked/setTurnScreenOn are all
    // available from API 23/24; we floor at 24 (the Expo/RN minimum) and gate the newer
    // special-access checks (exact-alarm 31, full-screen-intent 34) in code by SDK_INT.
    minSdkVersion 24
    // expo-module-gradle-plugin's publishing step reads android.defaultConfig.versionName
    // (MavenPublicationExtension) — it must be defined or configuration fails. The plugin
    // ALREADY declares the 'release' publishing variant itself (applyPublishingVariant),
    // so we must NOT add our own singleVariant('release') — that collides ("Using
    // singleVariant publishing DSL multiple times ... is not allowed").
    versionName '0.1.0'
  }

  lintOptions {
    // The manifest deliberately declares SCHEDULE_EXACT_ALARM / USE_FULL_SCREEN_INTENT /
    // REQUEST_IGNORE_BATTERY_OPTIMIZATIONS — all flagged by lint but intentional (see the
    // AndroidManifest justification block). Don't let those notes abort the CI build.
    abortOnError false
  }
}
